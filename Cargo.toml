[package]
name = "superiss"
version = "0.9.1"
edition = "2021"
license = "MIT"

[[bin]]
name = "superiss"
path = "superiss.rs"

[dependencies]
rusqlite = "=0.32.1"
serde_json = { version = "1", features = ["float_roundtrip"] }
libc = "0.2"
sha2 = "=0.10.9"
tiktoken-rs = "=0.12.0"

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
