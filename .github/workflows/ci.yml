name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos-acceptance:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      CARGO_TARGET_DIR: .cache/cargo
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.cache/tiktoken
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.3"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.13.5"
      - name: Python tokenizer
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python --require-hashes -r requirements-tokenizer.lock
          .venv/bin/python -c 'import tiktoken; tiktoken.get_encoding("o200k_base"); tiktoken.get_encoding("cl100k_base")'
          echo "SIS_PYTHON=$GITHUB_WORKSPACE/.venv/bin/python" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --locked -j2
      - name: Contract and recovery gate
        run: bash tools/verify-all.sh
      - name: Runnable quickstart
        run: python3 examples/quickstart.py
