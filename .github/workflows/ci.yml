name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos-acceptance:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      CARGO_TARGET_DIR: .cache/cargo
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.cache/tiktoken
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.3"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.13.5"
      - name: Python tokenizer
        run: |
          uv venv --python 3.14 .venv
          uv pip install --python .venv/bin/python --require-hashes -r requirements-tokenizer.lock
          .venv/bin/python -c 'import tiktoken; tiktoken.get_encoding("o200k_base"); tiktoken.get_encoding("cl100k_base")'
          echo "SIS_PYTHON=$GITHUB_WORKSPACE/.venv/bin/python" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --locked -j2
      - name: Python daemon startup smoke
        run: |
          cat > .cache/python-startup-trace <<'SCRIPT'
          #!/usr/bin/env bash
          exec "$SIS_TRACE_PYTHON" -c 'import faulthandler,os,runpy,sys; faulthandler.dump_traceback_later(5); sys.argv=sys.argv[1:]; sys.path.insert(0,os.path.dirname(sys.argv[0])); runpy.run_path(sys.argv[0],run_name="__main__")' "$@"
          SCRIPT
          chmod +x .cache/python-startup-trace
          SIS_TRACE_PYTHON="$SIS_PYTHON" SIS_PYTHON="$PWD/.cache/python-startup-trace" python3 tests/integration_suite.py --impl py --case http_health
      - name: Contract and recovery gate
        run: bash tools/verify-all.sh
      - name: Runnable quickstart
        run: python3 examples/quickstart.py
