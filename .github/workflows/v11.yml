name: Superiss 1.6.2
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  current-runtime-and-forge:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.4'
      - name: Install explicit verification dependencies
        run: |
          npm install --prefix .cache/v11-tools --no-audit --no-fund typescript@7.1.0-dev.20261108.1 @types/node@24.19.2 @types/bun@1.4.4
          echo "$GITHUB_WORKSPACE/.cache/v11-tools/node_modules/.bin" >> "$GITHUB_PATH"
          echo "SIS_TYPE_ROOTS=$GITHUB_WORKSPACE/.cache/v11-tools/node_modules/@types" >> "$GITHUB_ENV"
      - name: Current core, forge, protocol and relocatable package
        run: bun tools/check-v11.ts
      - name: Release archive, installer and oracle worker
        run: |
          v="$(jq -r .version packages/superiss/package.json)"
          tools/release-asset.sh "$RUNNER_TEMP/asset"
          tools/install.sh --version "$v" --from "$RUNNER_TEMP/asset/superiss-$v.tar.gz" --prefix "$RUNNER_TEMP/sis" --bin-dir "$RUNNER_TEMP/bin"
          db="$RUNNER_TEMP/p/.sis/p.db"; mkdir -p "$(dirname "$db")"; echo ok > "$RUNNER_TEMP/p/README.md"
          "$RUNNER_TEMP/bin/sis" create id=h title=health lane=ops oracle_cmd='test -s README.md' allowed_paths='["README.md"]' --db "$db"
          SIS_DIRECT=1 "$RUNNER_TEMP/bin/sis" work lane=ops once=true --db "$db" --actor ci
          test "$("$RUNNER_TEMP/bin/sis" show id=h --db "$db" | jq -r .issue.status)" = closed
          # Switching over an existing current link must replace it, not move into its target.
          mkdir -p "$RUNNER_TEMP/sis/releases/old" && ln -sfn "$RUNNER_TEMP/sis/releases/old" "$RUNNER_TEMP/sis/current"
          tools/install.sh --version "$v" --from "$RUNNER_TEMP/asset/superiss-$v.tar.gz" --prefix "$RUNNER_TEMP/sis" --bin-dir "$RUNNER_TEMP/bin"
          case "$(readlink "$RUNNER_TEMP/sis/current")" in "$RUNNER_TEMP/sis/releases/$v-"*) ;; *) echo "current not switched"; exit 1 ;; esac
          test -z "$(ls -A "$RUNNER_TEMP/sis/releases/old")"
      - name: Linux local-zero sandbox with bubblewrap
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces; allow them for bwrap only.
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile bwrap /usr/bin/bwrap flags=(unconfined) {\n  userns,\n}\n' | sudo tee /etc/apparmor.d/bwrap >/dev/null
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
          bun -e "import {localZeroAvailable} from './packages/superiss/ts/util.ts'; if (!localZeroAvailable()) { console.error('bubblewrap unusable'); process.exit(1); }"
          bun test packages/superiss/local-zero.test.ts packages/superiss/orchestration.test.ts --bail
  linux-distros:
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:12', 'ubuntu:22.04', 'ubuntu:24.04', 'fedora:41', 'rockylinux:9', 'amazonlinux:2023', 'opensuse/leap:15.6', 'archlinux:latest', 'alpine:3.20']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.4'
      - name: Install release archive and run recur -> work in ${{ matrix.image }}
        run: |
          v="$(jq -r .version packages/superiss/package.json)"
          tools/release-asset.sh "$RUNNER_TEMP/asset"
          docker run --rm -v "$RUNNER_TEMP/asset:/a:ro" -v "$PWD/tools:/t:ro" "${{ matrix.image }}" sh /t/distro-smoke.sh "/a/superiss-$v.tar.gz" "$v"
  freebsd-node:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.4'
      - name: Build release archive
        run: tools/release-asset.sh "$GITHUB_WORKSPACE/.cache/asset"
      - name: FreeBSD 14 with Node only (no Bun exists for FreeBSD)
        uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b
        with:
          release: '14.2'
          usesh: true
          prepare: pkg install -y node22 bash
          run: |
            v="$(node -e 'console.log(require("./packages/superiss/package.json").version)')"
            bash tools/node-smoke.sh "$PWD/.cache/asset/superiss-$v.tar.gz" "$v"
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.4'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build release archive
        shell: bash
        run: tools/release-asset.sh "$RUNNER_TEMP/asset"
      - name: Install and run a direct-mode worker cycle with a cmd oracle
        shell: pwsh
        run: |
          $v = (Get-Content packages/superiss/package.json -Raw | ConvertFrom-Json).version
          ./tools/install.ps1 -Version $v -From "$env:RUNNER_TEMP\asset\superiss-$v.tar.gz" -Prefix "$env:RUNNER_TEMP\sis"
          $sis = "$env:RUNNER_TEMP\sis\bin\sis.cmd"
          $p = "$env:RUNNER_TEMP\p"; New-Item -ItemType Directory -Force "$p\.sis" | Out-Null; Set-Content "$p\README.md" 'ok'
          Set-Location $p
          $task = @{ id = 'w'; title = 'windows'; lane = 'ops'; oracle_cmd = 'if exist README.md (exit /b 0) else (exit /b 1)'; allowed_paths = @('README.md') } | ConvertTo-Json -Compress
          Set-Content "$p\task.json" $task
          & $sis create "@$p\task.json" --db "$p\.sis\p.db"
          & $sis work lane=ops once=true --db "$p\.sis\p.db" --actor win
          $status = (& $sis show id=w --db "$p\.sis\p.db" | ConvertFrom-Json).issue.status
          if ($status -ne 'closed') { throw "expected closed, got $status" }
          Write-Output "windows native passed"
  worktrunk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.4'
      - name: Install Worktrunk 0.81.0 with published checksum
        run: |
          mkdir -p .cache/worktrunk
          cd .cache/worktrunk
          curl --fail --location --max-time 120 --output worktrunk-x86_64-unknown-linux-musl.tar.xz https://github.com/max-sixty/worktrunk/releases/download/v0.81.0/worktrunk-x86_64-unknown-linux-musl.tar.xz
          curl --fail --location --max-time 60 --output archive.sha256 https://github.com/max-sixty/worktrunk/releases/download/v0.81.0/worktrunk-x86_64-unknown-linux-musl.tar.xz.sha256
          sha256sum --check archive.sha256
          tar -xf worktrunk-x86_64-unknown-linux-musl.tar.xz
          executable="$(find "$PWD" -type f -name wt -perm -u+x -print -quit)"
          test -n "$executable"
          echo "SIS_TEST_WORKTRUNK=$executable" >> "$GITHUB_ENV"
      - name: Real Worktrunk binding and proof-gated merge
        run: bun test sisf/workflow.test.ts
